<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Microscopic Structures Animation</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 10px; background: #f4f7f6; color: #333; }
  .container { max-width: 800px; margin: auto; background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
  canvas { background: #eef4f9; border: 1px solid #ccc; max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 15px auto; touch-action: manipulation; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 15px; }
  select, button { padding: 10px 14px; font-size: 14px; border-radius: 6px; border: 1px solid #0056b3; background: #007bff; color: white; cursor: pointer; }
  select { background: #f8f9fa; color: #333; border: 1px solid #ccc; }
  button:active { background: #004494; }
  .info-box { background: #e9ecef; padding: 12px; border-radius: 6px; font-size: 14px; margin-bottom: 15px; line-height: 1.5; }
  .legend { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; font-weight: bold; font-size: 13px; margin-bottom: 15px; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid #333; }
</style>
</head>
<body>
<div class="container">
  <div class="legend" id="legendBox"></div>
  
  <div class="controls">
    <select id="substance" onchange="resetSim()">
      <option value="Mg">Magnesium (Mg)</option>
      <option value="Na">Sodium (Na)</option>
      <option value="NaCl">Sodium Chloride (NaCl)</option>
    </select>
    <select id="state" onchange="resetSim()" style="display:none;">
      <option value="solid">Structure (Solid)</option>
      <option value="molten">Molten</option>
      <option value="aqueous">Aqueous</option>
    </select>
    <button onclick="toggleBattery()">Toggle Battery</button>
    <button onclick="toggleHeat()">Toggle Heat</button>
    <button onclick="applyForce()">Apply Force</button>
    <button onclick="resetSim()" style="background:#6c757d; border-color:#5a6268;">Reset</button>
  </div>
  
  <div class="info-box" id="infoText">Select a substance to view its microscopic structure.</div>
  
  <canvas id="simCanvas" width="600" height="400"></canvas>
</div>

<script>
  const canvas = document.getElementById('simCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let battery = false;
  let heat = false;
  let shattered = false;
  let forceApplied = false;

  function updateInfo() {
    const sub = document.getElementById('substance').value;
    const state = document.getElementById('state').value;
    const info = document.getElementById('infoText');
    const legend = document.getElementById('legendBox');
    
    // Update Legend
    let legendHTML = '';
    if (sub === 'Mg') {
      legendHTML = '<div class="legend-item"><span class="dot" style="background:#ff9999;"></span>Mg²⁺ Cation</div>' +
                   '<div class="legend-item"><span class="dot" style="background:#5555ff;"></span>e⁻ (Delocalised Electron)</div>';
    } else if (sub === 'Na') {
      legendHTML = '<div class="legend-item"><span class="dot" style="background:#ff9999;"></span>Na⁺ Cation</div>' +
                   '<div class="legend-item"><span class="dot" style="background:#5555ff;"></span>e⁻ (Delocalised Electron)</div>';
    } else if (sub === 'NaCl') {
      legendHTML = '<div class="legend-item"><span class="dot" style="background:#ff9999;"></span>Na⁺ Cation</div>' +
                   '<div class="legend-item"><span class="dot" style="background:#99ff99;"></span>Cl⁻ Anion</div>';
      if (state === 'aqueous') {
         legendHTML += '<div class="legend-item"><span class="dot" style="background:#99ccff;"></span>H₂O Molecule</div>';
      }
    }
    legend.innerHTML = legendHTML;

    // Update Text Descriptions
    if (forceApplied) {
       if (sub === 'NaCl' && state === 'solid') {
         info.innerHTML = "<strong>Hard but Brittle:</strong> Ionic compounds are hard due to strong ionic bonds, but they are very brittle. When force is applied, layers of ions shift, causing ions of the same charge to align and repel each other, shattering the lattice.";
       } else if ((sub === 'Mg' || sub === 'Na') && state === 'solid') {
         info.innerHTML = "<strong>Malleable and Ductile:</strong> In metal, the attraction between metal ions and the delocalised electrons holds the particles together (metallic bond). Metallic bond is non-directional. Layers of metal ions can easily slide over each another and their new positions are still held by sea of electrons. ∴metals have high ductility.";
       } else {
         info.innerHTML = "Force applied to the fluid state disperses the particles further.";
       }
    } else if (heat) {
       if (sub === 'NaCl' && state === 'solid') {
         info.innerHTML = "<strong>Heating:</strong> When heat is applied, the Na⁺ and Cl⁻ ions vibrate more vigorously in their fixed positions. A large amount of energy is required to overcome the strong ionic bonds between oppositely charged ions that are holding the giant lattice together. Consequently, NaCl has a very high melting point of 801°C.";
       } else {
         info.innerHTML = "<strong>Heating:</strong> Thermal energy increases the kinetic energy and vibration of the particles.";
       }
    } else if (battery) {
       if (sub === 'NaCl' && state === 'solid') {
         info.innerHTML = "<strong>Non-conductive (Solid):</strong> The Na⁺ and Cl⁻ ions are held in fixed positions by strong ionic bonds. There are no mobile ions to conduct electricity.";
       } else if (sub === 'NaCl' && (state === 'molten' || state === 'aqueous')) {
         info.innerHTML = "<strong>Conductive (Fluid):</strong> The lattice is broken down, releasing mobile ions. Na⁺ cations drift toward the negative electrode, while Cl⁻ anions drift toward the positive electrode, completing the circuit.";
       } else {
         info.innerHTML = "<strong>Conductive:</strong> The 'sea' of delocalised electrons drifts towards the positive terminal, creating an electric current. The metal cations remain fixed in their lattice positions.";
       }
    } else {
       if (sub === 'NaCl') {
         info.innerHTML = state === 'solid' ? "<strong>Giant Ionic Structure:</strong> A highly ordered 3D lattice held together by strong electrostatic attraction (ionic bonds) between oppositely charged Na⁺ and Cl⁻ ions." : "<strong>Fluid State:</strong> The lattice is broken down, allowing mobile ions to move freely.";
       } else {
         info.innerHTML = "<strong>Giant Metallic Structure:</strong> Metal cations are arranged in a regular lattice, surrounded by a 'sea' of delocalised electrons that are free to move randomly throughout the structure.";
       }
    }
  }

  function toggleBattery() { battery = !battery; updateInfo(); }
  function toggleHeat() { heat = !heat; updateInfo(); }
  
  function applyForce() {
    forceApplied = true;
    const sub = document.getElementById('substance').value;
    const state = document.getElementById('state').value;
    
    if (sub === 'NaCl' && state === 'solid') {
       shattered = true;
       // Shatter effect
       particles.forEach(p => { p.isFixed = false; p.vx = (Math.random()-0.5)*12; p.vy = (Math.random()-0.5)*12; });
    } else {
       // Sliding layers effect
       particles.forEach(p => { if (p.isFixed && p.ty < canvas.height / 2) p.tx += 40; });
    }
    updateInfo();
  }

  function resetSim() {
    const sub = document.getElementById('substance').value;
    const stateSelect = document.getElementById('state');
    
    if (sub === 'NaCl') {
      stateSelect.style.display = 'inline-block';
    } else {
      stateSelect.style.display = 'none';
      stateSelect.value = 'solid'; 
    }
    const state = stateSelect.value;

    particles = [];
    battery = false;
    heat = false;
    shattered = false;
    forceApplied = false;

    const rows = 5;
    const cols = 8;
    const spacing = 45;
    const startX = (canvas.width - cols * spacing) / 2 + 20;
    const startY = (canvas.height - rows * spacing) / 2 + 20;

    if (sub === 'Mg' || sub === 'Na') {
      let charge = sub === 'Mg' ? 2 : 1;
      let label = sub === 'Mg' ? 'Mg²⁺' : 'Na⁺';
      let eCount = sub === 'Mg' ? 2 : 1;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          // Metal Cations
          particles.push({ x: startX + c*spacing, y: startY + r*spacing, tx: startX + c*spacing, ty: startY + r*spacing, vx: 0, vy: 0, r: 18, color: '#ff9999', text: label, charge: charge, isFixed: true });
          // Delocalised Electrons
          for(let e=0; e<eCount; e++) {
            particles.push({ x: startX + c*spacing + (Math.random()*40-20), y: startY + r*spacing + (Math.random()*40-20), tx: 0, ty: 0, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4, r: 6, color: '#5555ff', text: 'e⁻', charge: -1, isFixed: false });
          }
        }
      }
    } else if (sub === 'NaCl') {
       if (state === 'solid') {
         // Rigid Lattice
         for (let r = 0; r < rows; r++) {
           for (let c = 0; c < cols; c++) {
             let isNa = (r + c) % 2 === 0;
             particles.push({ x: startX + c*spacing, y: startY + r*spacing, tx: startX + c*spacing, ty: startY + r*spacing, vx: 0, vy: 0, r: 16, color: isNa ? '#ff9999' : '#99ff99', text: isNa ? 'Na⁺' : 'Cl⁻', charge: isNa ? 1 : -1, isFixed: true });
           }
         }
       } else {
         // Fluid States (Molten/Aqueous)
         for (let i=0; i<40; i++) {
             let isNa = i % 2 === 0;
             particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, tx: 0, ty: 0, vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3, r: 16, color: isNa ? '#ff9999' : '#99ff99', text: isNa ? 'Na⁺' : 'Cl⁻', charge: isNa ? 1 : -1, isFixed: false });
         }
         if (state === 'aqueous') {
           // Add Water Molecules
           for(let i=0; i<25; i++) {
               particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, tx: 0, ty: 0, vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2, r: 11, color: '#99ccff', text: 'H₂O', charge: 0, isFixed: false });
           }
         }
       }
    }
    updateInfo();
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (battery) {
       // Draw Electrodes
       ctx.fillStyle = 'rgba(255, 0, 0, 0.1)'; ctx.fillRect(0, 0, 50, canvas.height);
       ctx.fillStyle = 'rgba(0, 0, 255, 0.1)'; ctx.fillRect(canvas.width-50, 0, 50, canvas.height);
       ctx.fillStyle = 'red'; ctx.font = 'bold 24px Arial'; ctx.fillText('+', 25, 30); 
       ctx.fillStyle = 'blue'; ctx.fillText('-', canvas.width-25, 30);
    }

    particles.forEach(p => {
      let speedLimit = heat ? 7 : 3.5;
      
      if (p.isFixed && !shattered) {
         let jitter = heat ? (Math.random()-0.5)*6 : 0;
         p.x += (p.tx - p.x) * 0.1 + jitter;
         p.y += (p.ty - p.y) * 0.1 + jitter;
      } else {
         if (battery && p.charge !== 0) {
            // Drift logic: Cations (+) move right to Negative electrode, Anions (-) move left to Positive electrode
            p.vx += p.charge > 0 ? 0.15 : -0.15; 
         }
         
         p.x += p.vx; p.y += p.vy;

         // Wrap around horizontally to keep flow continuous
         if (p.x < 0) p.x = canvas.width;
         if (p.x > canvas.width) p.x = 0;
         
         // Bounce vertically
         if (p.y < 0) { p.y = 0; p.vy *= -1; }
         if (p.y > canvas.height) { p.y = canvas.height; p.vy *= -1; }

         // Enforce speed limits
         if (p.vx > speedLimit) p.vx = speedLimit;
         if (p.vx < -speedLimit) p.vx = -speedLimit;
         if (p.vy > speedLimit) p.vy = speedLimit;
         if (p.vy < -speedLimit) p.vy = -speedLimit;
      }

      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color; ctx.fill(); 
      ctx.lineWidth = 1.5; ctx.strokeStyle = '#333'; ctx.stroke();
      
      ctx.fillStyle = 'black'; ctx.font = p.r > 10 ? '12px Arial' : '10px Arial';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.text, p.x, p.y);
    });
    requestAnimationFrame(animate);
  }
  
  // Start Application
  resetSim(); 
  animate();
</script>
</body>
</html>
