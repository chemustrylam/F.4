<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giant Metallic & Ionic Structure Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
            margin: 0;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        #canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 450px;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.8); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 1); }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center">

    <div class="max-w-7xl w-full grid grid-cols-1 lg:grid-cols-3 gap-6 flex-grow">
        
        <!-- Main Canvas Area -->
        <div class="lg:col-span-2 flex flex-col gap-4">
            <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <h1 id="main-title" class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                        Giant Metallic Structure
                    </h1>
                    <p class="text-slate-400 mt-1" id="sub-title">Interactive simulation at the microscopic level.</p>
                </div>
                <div class="flex gap-1 bg-slate-800 p-1 rounded-lg border border-slate-700">
                    <button onclick="setSubstance('Mg')" id="btn-sub-mg" class="px-4 py-2 rounded bg-blue-600 text-white font-semibold text-sm transition-colors shadow-lg">Magnesium</button>
                    <button onclick="setSubstance('Na')" id="btn-sub-na" class="px-4 py-2 rounded hover:bg-slate-700 text-slate-300 font-semibold text-sm transition-colors">Sodium</button>
                    <button onclick="setSubstance('NaCl')" id="btn-sub-nacl" class="px-4 py-2 rounded hover:bg-slate-700 text-slate-300 font-semibold text-sm transition-colors">NaCl (Ionic)</button>
                </div>
            </header>

            <div id="canvas-container" class="flex-grow border border-slate-700">
                <canvas id="simulationCanvas"></canvas>
            </div>
            
            <div class="flex flex-wrap justify-center gap-2">
                <button onclick="setMode('normal')" id="btn-normal" class="glass-panel hover:bg-slate-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors border border-blue-500 bg-blue-900/30 flex-1 min-w-[120px]">
                    Structure
                </button>
                <button onclick="setMode('battery')" id="btn-battery" class="glass-panel hover:bg-slate-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors border-transparent flex-1 min-w-[120px]">
                    Connect Battery
                </button>
                <button onclick="setMode('battery_molten')" id="btn-battery-molten" style="display: none;" class="glass-panel hover:bg-slate-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors border-transparent flex-1 min-w-[120px]">
                    Molten (Conducts)
                </button>
                <button onclick="setMode('battery_aqueous')" id="btn-battery-aqueous" style="display: none;" class="glass-panel hover:bg-slate-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors border-transparent flex-1 min-w-[120px]">
                    Aqueous (Conducts)
                </button>
                <button onclick="setMode('heat')" id="btn-heat" class="glass-panel hover:bg-slate-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors border-transparent flex-1 min-w-[120px]">
                    Apply Heat
                </button>
                <button onclick="setMode('force')" id="btn-force" class="glass-panel hover:bg-slate-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors border-transparent flex-1 min-w-[120px]">
                    Apply Force
                </button>
            </div>
        </div>

        <div class="glass-panel rounded-xl p-6 flex flex-col h-full overflow-hidden max-h-[800px]">
            <h2 class="text-xl font-bold mb-4 text-emerald-400 border-b border-slate-600 pb-2 shrink-0">Properties Explained</h2>
            
            <div class="mb-4 pb-4 border-b border-slate-600 shrink-0" id="legend-container">
                <!-- Legend dynamically injected here -->
            </div>

            <div id="info-content" class="text-slate-300 space-y-4 overflow-y-auto flex-grow text-sm md:text-base leading-relaxed pr-2">
                <!-- Content dynamically injected here -->
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simulationCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');

        // Substance configuration strictly handling exact electron counts
        let currentSubstance = 'Mg';
        const substanceData = {
            'Mg': { type: 'metal', name: 'Magnesium', symbol: 'Mg', displayIon: 'Mg²⁺', electronsPerIon: 2, meltingPoint: '650°C' },
            'Na': { type: 'metal', name: 'Sodium', symbol: 'Na', displayIon: 'Na⁺', electronsPerIon: 1, meltingPoint: '98°C' },
            'NaCl': { type: 'ionic', name: 'Sodium Chloride', symbol: 'NaCl', displayCation: 'Na⁺', displayAnion: 'Cl⁻', meltingPoint: '801°C' }
        };

        function getInfoTexts() {
            const data = substanceData[currentSubstance];
            if (data.type === 'ionic') {
                return {
                    normal: `
                        <h3 class="text-lg font-semibold text-white">Giant Ionic Structure</h3>
                        <p><strong>Sodium Chloride (NaCl)</strong> forms a giant ionic structure.</p>
                        <p>It consists of a regular, repeating three-dimensional arrangement of positive ${data.displayCation} ions and negative ${data.displayAnion} ions.</p>
                        <p>The ions are held together by strong electrostatic forces of attraction between oppositely charged ions, known as <strong>ionic bonds</strong>.</p>
                    `,
                    battery: `
                        <h3 class="text-lg font-semibold text-white">Electrical Conductivity (Solid)</h3>
                        <p>In the solid state, ionic compounds like NaCl <strong>do not conduct electricity</strong>.</p>
                        <p>The ${data.displayCation} and ${data.displayAnion} ions are held tightly in fixed positions within the giant lattice by strong ionic bonds. There are no mobile ions to conduct electricity.</p>
                    `,
                    battery_molten: `
                        <h3 class="text-lg font-semibold text-white">Electrical Conductivity (Molten)</h3>
                        <p>When heated strongly until molten, the immense thermal energy overcomes the strong ionic bonds, breaking down the rigid lattice.</p>
                        <p>The ${data.displayCation} and ${data.displayAnion} ions are now <strong>mobile</strong>. When a battery is connected, cations (+) drift toward the negative terminal, and anions (-) drift toward the positive terminal, creating a current. They collect at the electrodes.</p>
                    `,
                    battery_aqueous: `
                        <h3 class="text-lg font-semibold text-white">Electrical Conductivity (Aqueous)</h3>
                        <p>When dissolved in water, the lattice is broken down by water molecules.</p>
                        <p>The hydrated ${data.displayCation} and ${data.displayAnion} ions become <strong>mobile</strong>. Just like in the molten state, these mobile ions carry electric charge: cations drift towards the negative terminal, while anions drift towards the positive terminal within the electrolyte.</p>
                    `,
                    heat: `
                        <h3 class="text-lg font-semibold text-white">High Melting Point</h3>
                        <p><strong>Heating:</strong> When heat is applied, the ${data.displayCation} and ${data.displayAnion} ions vibrate more vigorously in their fixed positions.</p>
                        <p>A large amount of energy is required to overcome the strong ionic bonds between oppositely charged ions that are holding the giant lattice together. Consequently, NaCl has a very high melting point of <strong>801°C</strong>.</p>
                    `,
                    force: `
                        <h3 class="text-lg font-semibold text-white">Hard but Brittle</h3>
                        <p>Ionic compounds are hard due to strong ionic bonds, but they are very brittle.</p>
                        <p>When force is applied, layers of ions shift. As ions of the same charge align with each other, electrostatic repulsion breaks the lattice apart.</p>
                    `
                };
            }
            return {
                normal: `
                    <h3 class="text-lg font-semibold text-white">Giant Metallic Structure</h3>
                    <p>Metals like ${data.name} form a <strong>giant metallic structure</strong>.</p>
                    <p>Metal cations (${data.displayIon}) are arranged in a regular lattice, surrounded by a "sea" of delocalised electrons that move freely near the metal ions throughout the structure.</p>
                    <p>The strong electrostatic attraction between the positive metal ions and the negative sea of electrons is called the <strong>metallic bond</strong>.</p>
                `,
                battery: `
                    <h3 class="text-lg font-semibold text-white">Good Conductors of Electricity</h3>
                    <p>When connected to a battery, an electric field is created.</p>
                    <p>The "sea" of delocalised electrons acts as mobile charge carriers, drifting collectively towards the positive terminal. They flow continuously through the external wire circuit, creating an <strong>electric current</strong>.</p>
                `,
                heat: `
                    <h3 class="text-lg font-semibold text-white">Heat Conduction & High Melting Point</h3>
                    <p><strong>Heating:</strong> Thermal energy increases the kinetic energy and vibration of the particles.</p>
                    <p>Because metallic bonds are strong, high melting points are typical for giant metallic structures. A massive amount of energy is required to break them apart.</p>
                `,
                force: `
                    <h3 class="text-lg font-semibold text-white">Malleability and Ductility</h3>
                    <p>In metal, the attraction between metal ions and the delocalised electrons holds the particles together (metallic bond).</p>
                    <p>Metallic bond is <strong>non-directional</strong>. Layers of metal ions can easily slide over each another and their new positions are still held by sea of electrons. ∴ metals have high ductility.</p>
                `
            };
        }

        let mode = 'normal'; // 'normal', 'battery', 'heat', 'force'
        let ions = [];
        let electrons = [];
        let solventParticles = [];
        let animationFrameId;

        const latticeRows = 4;
        const latticeCols = 6;
        let ionRadius = 25;
        let spacingX = 0;
        let spacingY = 0;
        let offsetX = 0;
        let offsetY = 0;
        
        let latticeBounds = { minX: 0, maxX: 0, minY: 0, maxY: 0 };

        class Ion {
            constructor(row, col, isAnion = false) {
                this.row = row;
                this.col = col;
                this.isAnion = isAnion;
                this.baseX = 0;
                this.baseY = 0;
                this.x = 0;
                this.y = 0;
                this.mobile = false;
                this.vx = 0;
                this.vy = 0;
                this.shiftX = 0; 
                this.targetShiftX = 0;
                this.phase = Math.random() * Math.PI * 2; 
                this.fractured = false;
                this.fractureOffsetX = 0;
                this.fractureOffsetY = 0;
            }

            updatePositions() {
                this.baseX = offsetX + this.col * spacingX;
                this.baseY = offsetY + this.row * spacingY;
            }

            update(dt) {
                let amplitude = mode === 'heat' ? 5.0 : 0.8;
                let freq = mode === 'heat' ? 0.03 : 0.005;
                const isIonic = substanceData[currentSubstance].type === 'ionic';
                const isMoltenOrAqueous = isIonic && (mode === 'battery_molten' || mode === 'battery_aqueous');
                const currentRadius = this.isAnion ? ionRadius * 1.1 : ionRadius * 0.8;

                // Fluid physics for Molten/Aqueous (Strict Electrode Boundaries)
                if (isMoltenOrAqueous) {
                    if (!this.mobile) {
                        this.mobile = true;
                        this.vx = (Math.random() - 0.5) * 4;
                        this.vy = (Math.random() - 0.5) * 4;
                    }
                    let driftSpeed = mode === 'battery_aqueous' ? 0.15 : 0.1;
                    // Anions (-) move right to (+), Cations (+) move left to (-)
                    if (this.isAnion) this.vx += driftSpeed; 
                    else this.vx -= driftSpeed; 

                    this.vx += (Math.random() - 0.5) * 1.5;
                    this.vy += (Math.random() - 0.5) * 1.5;

                    let maxSpeed = mode === 'battery_aqueous' ? 4 : 3;
                    let speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    if (speed > maxSpeed) {
                        this.vx = (this.vx / speed) * maxSpeed;
                        this.vy = (this.vy / speed) * maxSpeed;
                    }

                    this.x += this.vx; this.y += this.vy;
                    
                    // Crucial: Ions DO NOT pass through electrodes (40px wide on edges)
                    if (this.x < 40 + currentRadius) { 
                        this.x = 40 + currentRadius; 
                        this.vx *= -0.3; // Collect at the electrode
                    }
                    if (this.x > canvas.width - 40 - currentRadius) { 
                        this.x = canvas.width - 40 - currentRadius; 
                        this.vx *= -0.3; // Collect at the electrode
                    }
                    
                    if (this.y < currentRadius) { this.y = currentRadius; this.vy *= -1; }
                    if (this.y > canvas.height - currentRadius) { this.y = canvas.height - currentRadius; this.vy *= -1; }
                    return; 
                }

                // Return to solid state smoothly
                if (this.mobile) {
                    this.vx *= 0.9; this.vy *= 0.9;
                    this.x += (this.baseX + this.shiftX - this.x) * 0.1;
                    this.y += (this.baseY - this.y) * 0.1;
                    if (Math.abs(this.x - (this.baseX + this.shiftX)) < 1 && Math.abs(this.y - this.baseY) < 1) this.mobile = false;
                    return;
                }

                // Force physics (Sliding & Gentle Fracture)
                if (mode !== 'force') {
                    this.targetShiftX = 0;
                    this.shiftX += (this.targetShiftX - this.shiftX) * 0.05;
                    this.fractured = false;
                    this.fractureOffsetX += (0 - this.fractureOffsetX) * 0.1; 
                    this.fractureOffsetY += (0 - this.fractureOffsetY) * 0.1;
                } else {
                    if (this.row < 2) {
                        this.targetShiftX = spacingX; 
                        
                        // When top layer slides over exactly 1 spacing in NaCl, charges align
                        if (isIonic && Math.abs(this.shiftX - this.targetShiftX) < 1.5 && !this.fractured) {
                            this.fractured = true;
                        }
                    } else {
                        this.targetShiftX = 0;
                        if (isIonic && this.shiftX > 0 && Math.abs(ions[0].shiftX - spacingX) < 1.5 && !this.fractured) {
                             this.fractured = true;
                        }
                    }
                    
                    if (!this.fractured) {
                        this.shiftX += (this.targetShiftX - this.shiftX) * 0.05;
                    } else {
                        // Move further away to show significant repulsion and breaking
                        let breakGapY = 25;
                        let breakGapX = 12;
                        if (this.row < 2) {
                            this.fractureOffsetY += (-breakGapY - this.fractureOffsetY) * 0.1;
                            this.fractureOffsetX += (breakGapX - this.fractureOffsetX) * 0.1;
                        } else {
                            this.fractureOffsetY += (breakGapY - this.fractureOffsetY) * 0.1;
                            this.fractureOffsetX += (-breakGapX - this.fractureOffsetX) * 0.1;
                        }
                    }
                }

                this.x = this.baseX + this.shiftX + this.fractureOffsetX + Math.sin(Date.now() * freq + this.phase) * amplitude;
                this.y = this.baseY + this.fractureOffsetY + Math.cos(Date.now() * freq + this.phase) * amplitude;
            }

            draw() {
                const isIonic = substanceData[currentSubstance].type === 'ionic';
                let currentRadius = ionRadius;
                ctx.beginPath();
                
                if (isIonic) {
                    if (this.isAnion) {
                        currentRadius = ionRadius * 1.1;
                        ctx.arc(this.x, this.y, currentRadius, 0, Math.PI * 2);
                        ctx.shadowBlur = mode === 'heat' ? 20 : 10; ctx.shadowColor = '#4ade80';
                        ctx.fillStyle = mode === 'heat' ? 'rgba(74, 222, 128, 0.3)' : 'rgba(74, 222, 128, 0.15)';
                        ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#22c55e'; ctx.stroke();
                        ctx.shadowBlur = 0; ctx.fillStyle = '#4ade80';
                        ctx.font = `bold ${currentRadius * 0.45}px Inter`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText('Cl⁻', this.x, this.y);
                    } else {
                        currentRadius = ionRadius * 0.8;
                        ctx.arc(this.x, this.y, currentRadius, 0, Math.PI * 2);
                        ctx.shadowBlur = mode === 'heat' ? 20 : 10; ctx.shadowColor = '#fb923c';
                        ctx.fillStyle = mode === 'heat' ? 'rgba(251, 146, 60, 0.3)' : 'rgba(251, 146, 60, 0.15)';
                        ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#f97316'; ctx.stroke();
                        ctx.shadowBlur = 0; ctx.fillStyle = '#fb923c';
                        ctx.font = `bold ${currentRadius * 0.45}px Inter`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                        ctx.fillText('Na⁺', this.x, this.y);
                    }
                } else {
                    ctx.arc(this.x, this.y, ionRadius, 0, Math.PI * 2);
                    ctx.shadowBlur = mode === 'heat' ? 20 : 10; ctx.shadowColor = '#3b82f6';
                    ctx.fillStyle = mode === 'heat' ? 'rgba(59, 130, 246, 0.3)' : 'rgba(59, 130, 246, 0.2)';
                    ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#3b82f6'; ctx.stroke();
                    ctx.shadowBlur = 0; ctx.fillStyle = '#93c5fd';
                    ctx.font = `bold ${ionRadius * 0.45}px Inter`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(substanceData[currentSubstance].displayIon, this.x, this.y);
                }
            }
        }

        class Electron {
            constructor() {
                // Spawn strictly inside the metal lattice bounding box
                this.x = latticeBounds.minX + Math.random() * (latticeBounds.maxX - latticeBounds.minX);
                this.y = latticeBounds.minY + Math.random() * (latticeBounds.maxY - latticeBounds.minY);
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.radius = 3;
            }
            update() {
                let speedMultiplier = mode === 'heat' ? 2.5 : 1.0;
                let maxSpeed = 3 * speedMultiplier;
                this.vx += (Math.random() - 0.5) * 1.5; this.vy += (Math.random() - 0.5) * 1.5;

                if (mode === 'battery') { this.vx += 0.8; maxSpeed = 5; }

                let speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > maxSpeed) { this.vx = (this.vx / speed) * maxSpeed; this.vy = (this.vy / speed) * maxSpeed; }

                this.x += this.vx; this.y += this.vy;

                if (mode === 'battery') {
                    // Electrons move through the wire, so they loop around the screen when they hit the electrode
                    if (this.x > canvas.width + 10) this.x = -10;
                    if (this.x < -10) this.x = canvas.width + 10;
                    if (this.y < latticeBounds.minY) { this.y = latticeBounds.minY; this.vy *= -1; }
                    if (this.y > latticeBounds.maxY) { this.y = latticeBounds.maxY; this.vy *= -1; }
                } else {
                    // Bounce tightly within the lattice bounding box
                    if (this.x < latticeBounds.minX) { this.x = latticeBounds.minX; this.vx *= -1; }
                    if (this.x > latticeBounds.maxX) { this.x = latticeBounds.maxX; this.vx *= -1; }
                    if (this.y < latticeBounds.minY) { this.y = latticeBounds.minY; this.vy *= -1; }
                    if (this.y > latticeBounds.maxY) { this.y = latticeBounds.maxY; this.vy *= -1; }
                }
            }
            draw() {
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.shadowBlur = 8; ctx.shadowColor = '#f472b6'; ctx.fillStyle = '#fdf2f8'; ctx.fill();
                ctx.shadowBlur = 0; ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
                ctx.beginPath(); ctx.moveTo(this.x - 1.5, this.y); ctx.lineTo(this.x + 1.5, this.y); ctx.stroke();
            }
        }

        class SolventParticle {
            constructor(type) {
                this.type = type; 
                this.x = 45 + Math.random() * (canvas.width - 90); this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 2; this.vy = (Math.random() - 0.5) * 2;
                this.angle = Math.random() * Math.PI * 2; this.va = (Math.random() - 0.5) * 0.2;
            }
            update() {
                if (mode === 'battery_aqueous') {
                    if (this.type === 'H⁺') this.vx -= 0.15; 
                    if (this.type === 'OH⁻') this.vx += 0.15; 
                }
                this.vx += (Math.random() - 0.5) * 0.8; this.vy += (Math.random() - 0.5) * 0.8;
                let maxSpeed = this.type === 'H₂O' ? 1.5 : 3.0;
                let speed = Math.hypot(this.vx, this.vy);
                if (speed > maxSpeed) { this.vx = (this.vx / speed) * maxSpeed; this.vy = (this.vy / speed) * maxSpeed; }

                this.x += this.vx; this.y += this.vy; this.angle += this.va;
                
                // Do not pass through electrodes
                if (this.x > canvas.width - 45) { this.x = canvas.width - 45; this.vx *= -1; } 
                if (this.x < 45) { this.x = 45; this.vx *= -1; }
                if (this.y > canvas.height + 15) this.y = -15; 
                if (this.y < -15) this.y = canvas.height + 15;
            }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle);
                if (this.type === 'H₂O') {
                    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fillStyle = 'rgba(239, 68, 68, 0.8)'; ctx.fill();
                    ctx.beginPath(); ctx.arc(7, 5, 4, 0, Math.PI * 2); ctx.fillStyle = 'rgba(248, 250, 252, 0.9)'; ctx.fill();
                    ctx.beginPath(); ctx.arc(7, -5, 4, 0, Math.PI * 2); ctx.fill();
                } else if (this.type === 'H⁺') {
                    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fillStyle = 'rgba(248, 250, 252, 0.9)'; ctx.fill();
                    ctx.fillStyle = '#ef4444'; ctx.font = 'bold 10px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('+', 0, 0);
                } else if (this.type === 'OH⁻') {
                    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fillStyle = 'rgba(239, 68, 68, 0.8)'; ctx.fill();
                    ctx.beginPath(); ctx.arc(7, 0, 4, 0, Math.PI * 2); ctx.fillStyle = 'rgba(248, 250, 252, 0.9)'; ctx.fill();
                    ctx.fillStyle = '#f8fafc'; ctx.font = 'bold 12px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('-', -2, 0);
                }
                ctx.restore();
            }
        }

        function drawOverlays() {
            if (mode === 'battery_aqueous') { ctx.fillStyle = 'rgba(56, 189, 248, 0.1)'; ctx.fillRect(40, 0, canvas.width-80, canvas.height); } 
            else if (mode === 'battery_molten') { ctx.fillStyle = 'rgba(249, 115, 22, 0.1)'; ctx.fillRect(40, 0, canvas.width-80, canvas.height); }

            if (mode === 'battery' || mode === 'battery_molten' || mode === 'battery_aqueous') {
                ctx.fillStyle = 'rgba(239, 68, 68, 0.15)'; ctx.fillRect(canvas.width - 40, 0, 40, canvas.height); // Positive Right
                ctx.fillStyle = 'rgba(59, 130, 246, 0.15)'; ctx.fillRect(0, 0, 40, canvas.height); // Negative Left
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.font = 'bold 24px Inter';
                ctx.fillText('+', canvas.width - 20, canvas.height / 2); ctx.fillText('-', 20, canvas.height / 2);

                if (substanceData[currentSubstance].type === 'metal') {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)'; ctx.font = '24px Inter';
                    for(let i=1; i<4; i++) { ctx.fillText('→', canvas.width/4 * i, latticeBounds.minY - 10); ctx.fillText('→', canvas.width/4 * i, latticeBounds.maxY + 20); }
                } else if (mode === 'battery') {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)'; ctx.font = 'italic 16px Inter'; ctx.textAlign = 'center'; ctx.fillText('No movement in solid state', canvas.width / 2, 100);
                } else {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)'; ctx.font = 'italic 16px Inter'; ctx.textAlign = 'center'; 
                    let stateTxt = mode === 'battery_molten' ? 'Molten State: Mobile ions conduct' : 'Aqueous State: Hydrated mobile ions conduct';
                    ctx.fillText(stateTxt, canvas.width / 2, 100);
                }

                let isConducting = false;
                if (substanceData[currentSubstance].type === 'metal' && mode === 'battery') isConducting = true;
                if (substanceData[currentSubstance].type === 'ionic' && (mode === 'battery_molten' || mode === 'battery_aqueous')) isConducting = true;

                const bulbX = canvas.width / 2;
                const bulbY = 50;

                // Draw connecting wires from the electrodes
                ctx.beginPath();
                ctx.strokeStyle = '#64748b';
                ctx.lineWidth = 2;
                ctx.moveTo(20, 0); 
                ctx.lineTo(20, 20);
                ctx.lineTo(bulbX - 20, 20);
                ctx.lineTo(bulbX - 10, bulbY);
                ctx.moveTo(canvas.width - 20, 0);
                ctx.lineTo(canvas.width - 20, 20);
                ctx.lineTo(bulbX + 20, 20);
                ctx.lineTo(bulbX + 10, bulbY);
                ctx.stroke();

                // Draw bulb base
                ctx.fillStyle = '#475569';
                ctx.fillRect(bulbX - 12, bulbY, 24, 12);
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(bulbX - 8, bulbY + 12, 16, 4);

                // Draw bulb glass
                ctx.beginPath();
                ctx.arc(bulbX, bulbY - 12, 16, 0, Math.PI * 2);
                
                if (isConducting) {
                    // Bright glowing state
                    ctx.fillStyle = 'rgba(253, 224, 71, 0.9)';
                    ctx.shadowBlur = 25;
                    ctx.shadowColor = '#fef08a';
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#eab308';
                    ctx.stroke();
                    
                    // Draw light rays
                    ctx.strokeStyle = 'rgba(253, 224, 71, 0.8)';
                    ctx.lineWidth = 2;
                    for(let i=0; i<8; i++) {
                        let angle = (i * Math.PI) / 4;
                        ctx.beginPath();
                        ctx.moveTo(bulbX + Math.cos(angle) * 22, bulbY - 12 + Math.sin(angle) * 22);
                        ctx.lineTo(bulbX + Math.cos(angle) * 32, bulbY - 12 + Math.sin(angle) * 32);
                        ctx.stroke();
                    }
                } else {
                    // Dull off state
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                    ctx.shadowBlur = 0;
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#64748b';
                    ctx.stroke();
                    
                    // Draw internal filament
                    ctx.beginPath();
                    ctx.moveTo(bulbX - 6, bulbY - 2);
                    ctx.lineTo(bulbX - 6, bulbY - 12);
                    ctx.lineTo(bulbX + 6, bulbY - 12);
                    ctx.lineTo(bulbX + 6, bulbY - 2);
                    ctx.strokeStyle = '#475569';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
                ctx.shadowBlur = 0; // Reset shadows for other rendering
            }

            if (mode === 'heat') {
                let gradient = ctx.createLinearGradient(0, canvas.height, 0, canvas.height - 100);
                gradient.addColorStop(0, 'rgba(239, 68, 68, 0.4)'); gradient.addColorStop(0.5, 'rgba(245, 158, 11, 0.2)'); gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = gradient; ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
                ctx.fillStyle = 'rgba(239, 68, 68, 0.6)';
                for(let i=0; i<canvas.width; i+=40) { let h = 10 + Math.random() * 20; ctx.fillRect(i, canvas.height - h, 30, h); }
            }

            if (mode === 'force') {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.font = 'bold 24px Inter';
                ctx.fillText('Force ➔', 80, offsetY + spacingY/2); ctx.fillText('Fixed', 80, offsetY + spacingY * 2.5);
            }
        }

        function initSimulation() {
            ions = []; electrons = [];
            spacingX = Math.min(canvas.width / (latticeCols + 1), 100);
            spacingY = Math.min(canvas.height / (latticeRows + 1), 100);
            ionRadius = Math.min(spacingX, spacingY) * 0.3;
            offsetX = (canvas.width - (spacingX * (latticeCols - 1))) / 2;
            offsetY = (canvas.height - (spacingY * (latticeRows - 1))) / 2;

            const margin = ionRadius * 1.5;
            latticeBounds.minX = offsetX - margin;
            latticeBounds.maxX = offsetX + (latticeCols - 1) * spacingX + margin;
            latticeBounds.minY = offsetY - margin;
            latticeBounds.maxY = offsetY + (latticeRows - 1) * spacingY + margin;

            const isIonic = substanceData[currentSubstance].type === 'ionic';
            for (let r = 0; r < latticeRows; r++) {
                for (let c = 0; c < latticeCols; c++) {
                    let isAnion = isIonic ? (r + c) % 2 !== 0 : false;
                    let ion = new Ion(r, c, isAnion);
                    ion.updatePositions(); ions.push(ion);
                }
            }
            if (!isIonic) {
                // Strictly enforce the exact electron ratio
                let totalIons = latticeRows * latticeCols;
                let electronsPerIon = substanceData[currentSubstance].electronsPerIon;
                let totalElectrons = totalIons * electronsPerIon;
                for (let i = 0; i < totalElectrons; i++) electrons.push(new Electron());
            }
        }

        function resizeCanvas() {
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width; canvas.height = rect.height;
            initSimulation();
        }

        function drawRepulsiveForces() {
            ctx.save();
            ctx.strokeStyle = '#ef4444'; // Red "thunderstorm" repulsion line
            ctx.lineWidth = 3;
            ctx.lineJoin = 'miter';
            
            // Loop through the boundary where identical charges align (row 1 and row 2)
            for (let c = 0; c < latticeCols - 1; c++) {
                let ionTop = ions[1 * latticeCols + c];
                let ionBot = ions[2 * latticeCols + c + 1]; // Offset by 1 because top row shifted right
                
                if (ionTop && ionBot) {
                    let rTop = ionTop.isAnion ? ionRadius * 1.1 : ionRadius * 0.8;
                    let rBot = ionBot.isAnion ? ionRadius * 1.1 : ionRadius * 0.8;
                    
                    // Start and end points just outside the ions
                    let startX = ionTop.x;
                    let startY = ionTop.y + rTop + 4;
                    let endX = ionBot.x;
                    let endY = ionBot.y - rBot - 4;
                    
                    // Draw jagged thunderstorm/spark line
                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    const numZigs = 7;
                    const dx = endX - startX;
                    const dy = endY - startY;
                    
                    for (let i = 1; i <= numZigs; i++) {
                        let t = i / numZigs;
                        let px = startX + dx * t;
                        let py = startY + dy * t;
                        if (i < numZigs) {
                            // Alternate left and right for zigzag, plus random jitter
                            let offset = (i % 2 === 0 ? 10 : -10);
                            px += offset + (Math.random() - 0.5) * 6; 
                        }
                        ctx.lineTo(px, py);
                    }
                    ctx.stroke();
                }
            }
            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawOverlays();
            solventParticles.forEach(particle => { particle.update(); particle.draw(); });
            ions.forEach(ion => { ion.update(); ion.draw(); });
            
            // Draw the repulsion thunderstorm effect if fractured
            if (mode === 'force' && substanceData[currentSubstance].type === 'ionic' && ions.length > 0 && ions[0].fractured) {
                drawRepulsiveForces();
            }

            electrons.forEach(electron => { electron.update(); electron.draw(); });
            animationFrameId = requestAnimationFrame(animate);
        }

        function setMode(newMode) {
            mode = newMode;
            if (mode === 'battery_aqueous') {
                solventParticles = [];
                for(let i=0; i<45; i++) solventParticles.push(new SolventParticle('H₂O'));
                for(let i=0; i<6; i++) solventParticles.push(new SolventParticle('H⁺'));
                for(let i=0; i<6; i++) solventParticles.push(new SolventParticle('OH⁻'));
            } else { solventParticles = []; }

            document.getElementById('info-content').innerHTML = getInfoTexts()[mode];
            const buttons = ['normal', 'battery', 'battery_molten', 'battery_aqueous', 'heat', 'force'];
            buttons.forEach(b => {
                const btn = document.getElementById(`btn-${b.replace('_', '-')}`);
                if (btn) {
                    if (b === mode) { btn.classList.remove('border-transparent'); btn.classList.add('border-blue-500', 'bg-blue-900/30'); } 
                    else { btn.classList.add('border-transparent'); btn.classList.remove('border-blue-500', 'bg-blue-900/30'); }
                }
            });
            updateLegend();
        }

        function updateLegend() {
            const data = substanceData[currentSubstance];
            const legendContainer = document.getElementById('legend-container');
            
            if (data.type === 'metal') {
                legendContainer.innerHTML = `
                    <div class="flex items-center gap-3 mb-2">
                        <div class="w-8 h-8 rounded-full bg-blue-500/20 border-2 border-blue-400 flex items-center justify-center shadow-[0_0_8px_#3b82f6]">
                            <span class="text-blue-400 text-[10px] font-bold">${data.displayIon}</span>
                        </div>
                        <span class="text-sm">Metal Cation</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full flex items-center justify-center relative">
                            <div class="w-2 h-2 rounded-full bg-pink-100 shadow-[0_0_6px_#f472b6]"></div>
                        </div>
                        <span class="text-sm">Delocalised Electron (e⁻)</span>
                    </div>
                `;
            } else {
                legendContainer.innerHTML = `
                    <div class="flex flex-wrap items-center gap-4">
                        <div class="flex items-center gap-2 mb-2">
                            <div class="w-8 h-8 rounded-full bg-orange-500/20 border-2 border-orange-400 flex items-center justify-center shadow-[0_0_8px_#fb923c]">
                                <span class="text-orange-400 text-[10px] font-bold">Na⁺</span>
                            </div>
                            <span class="text-sm">Sodium Cation</span>
                        </div>
                        <div class="flex items-center gap-2 mb-2">
                            <div class="w-8 h-8 rounded-full bg-green-500/20 border-2 border-green-400 flex items-center justify-center shadow-[0_0_8px_#4ade80]">
                                <span class="text-green-400 text-[10px] font-bold">Cl⁻</span>
                            </div>
                            <span class="text-sm">Chloride Anion</span>
                        </div>
                        <div class="flex items-center w-full gap-2" id="water-legend" style="display: none;">
                            <div class="w-8 h-8 flex items-center justify-center relative">
                                <div class="w-3 h-3 rounded-full bg-red-500 absolute"></div>
                                <div class="w-1.5 h-1.5 rounded-full bg-white absolute top-1 right-1"></div>
                                <div class="w-1.5 h-1.5 rounded-full bg-white absolute bottom-1 right-1"></div>
                            </div>
                            <span class="text-sm">Water (H₂O) & Ions</span>
                        </div>
                    </div>
                `;
            }
            const waterLegend = document.getElementById('water-legend');
            if (waterLegend) waterLegend.style.display = mode === 'battery_aqueous' ? 'flex' : 'none';
        }

        function setSubstance(sub) {
            currentSubstance = sub;
            ['mg', 'na', 'nacl'].forEach(id => {
                const btn = document.getElementById(`btn-sub-${id}`);
                btn.className = 'px-4 py-2 rounded hover:bg-slate-700 text-slate-300 font-semibold text-sm transition-colors';
            });
            document.getElementById(`btn-sub-${sub.toLowerCase()}`).className = 'px-4 py-2 rounded bg-blue-600 text-white font-semibold text-sm transition-colors shadow-lg';
            
            const isIonic = substanceData[sub].type === 'ionic';
            document.getElementById('btn-battery-molten').style.display = isIonic ? 'block' : 'none';
            document.getElementById('btn-battery-aqueous').style.display = isIonic ? 'block' : 'none';
            document.getElementById('btn-battery').innerText = isIonic ? 'Battery (Solid)' : 'Connect Battery';
            
            if (!isIonic && (mode === 'battery_molten' || mode === 'battery_aqueous')) mode = 'normal';

            const data = substanceData[sub];
            document.getElementById('main-title').innerText = isIonic ? "Giant Ionic Structure" : "Giant Metallic Structure";
            document.getElementById('sub-title').innerText = `Interactive simulation of ${data.name} (${data.symbol}) at the microscopic level.`;
            
            updateLegend(); initSimulation(); setMode(mode);
        }

        window.addEventListener('resize', resizeCanvas);
        window.onload = function() { resizeCanvas(); setSubstance('Mg'); animate(); };
    </script>
</body>
</html>
